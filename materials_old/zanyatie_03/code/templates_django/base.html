<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Blog{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <nav class="nav">
                <a href="{% url 'home' %}" class="nav-link">Home</a>
                <a href="{% url 'posts_list' %}" class="nav-link">Posts</a>
                <a href="{% url 'post_create' %}" class="nav-link">Create Post</a>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="main">
            {% block content %}
            {% endblock %}
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2024 My Blog. All rights reserved.</p>
        </footer>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
    {% block scripts %}
    {% endblock %}
</body>
</html>
